<p>{{ errMessage() }}</p>

<table>
  <tr>
    <td>Fashion Style:</td>
    <td>
      <input type="text" class="form-control" name="style" id="style"
        placeholder="Input Style" [(ngModel)]="fashion.style">
    </td>
  </tr>
  <tr>
    <td>Fashion Subject:</td>
    <td>
      <input type="text" class="form-control" name="fashion_subject" id="fashion_subject"
        placeholder="Input Subject" [(ngModel)]="fashion.fashion_subject">
    </td>
  </tr>
  <tr>
    <td>Fashion Detail:</td>
    <td>
      <input type="text" class="form-control" name="fashion_detail" id="fashion_detail"
        placeholder="Input Detail" [(ngModel)]="fashion.fashion_detail">
    </td>
  </tr>
  <tr>
    <td>Fashion Image:</td>
    <td>
      <input type="file" class="file-input" name="fashion_image" id="fashion_image"
        (change)="onFileSelected($event, fashion)">
    </td>
  </tr>
  <tr>
    <td colspan="2">
      <button (click)="postFashion()">Submit</button>
    </td>
  </tr>
</table>

<table>
  @if (savedFashion(); as f) {
    <tr>
      <td>Fashion Id:</td>
      <td>{{ f._id }}</td>
    </tr>
    <tr>
      <td>Fashion Subject:</td>
      <td>{{ f.fashion_subject }}</td>
    </tr>
    <tr>
      <td>Fashion Detail:</td>
      <td>{{ f.fashion_detail }}</td>
    </tr>
    <tr>
      <td colspan="2">
        <img src="{{ f.getBase64String() }}" width="200">
      </td>
    </tr>
  }
</table>
