<p>product-detail-component works!</p>

<p>{{ errMessage() }}</p>

<table border="1">
  @if (product() != null) {
    <tr>
      <td>Product ID:</td>
      <td>{{ product()?.id }}</td>
      <td rowspan="3">
        <img [src]="product()?.image_link" alt="Product image" width="120" />
      </td>
    </tr>
    <tr>
      <td>Product Name:</td>
      <td>{{ product()?.name }}</td>
    </tr>
    <tr>
      <td>Price:</td>
      <td>{{ product()?.price }}</td>
    </tr>
  } @else {
    <tr>
      <td colspan="3">Cannot find the product</td>
    </tr>
  }
</table>

<button (click)="goBack()"> Go Back </button>
