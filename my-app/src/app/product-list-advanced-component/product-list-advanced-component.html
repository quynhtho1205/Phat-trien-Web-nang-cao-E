<p>product-list-advanced-component works!</p>
{{errMessage()}}
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
      <th>Slugs</th>
      
    </tr>
  </thead>

  <tbody>
    @for (p of products(); track p.id) {
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>
        <a (click)="viewDetail(p.id)" style="cursor: pointer;" title="click here to view detail">
          View detail
        </a>
      </td>
      <td>
        <a [routerLink]="['/products', generateSlug(p.name, p.id)]" style="cursor: pointer;">
          {{ generateSlug(p.name, p.id) }}
        </a>
      </td>
    </tr>
  } @empty {
    <tr>
      <td colspan="3">No products available.</td>
    </tr>
  }
  </tbody>
</table>
