<div class="container mt-4" style="max-width: 500px; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
  <form [formGroup]="regForm" (ngSubmit)="onSubmit()">

    <!-- Title with uppercase pipe -->
    <h3 class="text-center mb-4">{{ 'Course Registration' | uppercase }}</h3>

    <!-- Name -->
    <div class="mb-3">
      <label class="form-label fw-bold" for="name">Name:</label>
      <input
        type="text"
        id="name"
        class="form-control"
        formControlName="name"
        placeholder="Enter your name">
      <div class="text-danger" *ngIf="regForm.get('name')?.invalid && regForm.get('name')?.touched">
        <small>Please enter your name.</small>
      </div>
      <div class="text-danger" *ngIf="regForm.get('name')?.errors?.['nameNotMatch']">
        <small>Name must not contain special characters</small>
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-bold">Email:</label>
      <input
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="test@gmail.com">
      <div class="text-danger" *ngIf="regForm.get('email')?.invalid && regForm.get('email')?.touched">
        <small>Email format is invalid.</small>
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="form-label fw-bold">Password:</label>
      <div class="input-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <span *ngIf="!showPassword"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/></svg></span>
          <span *ngIf="showPassword"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/><path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/></svg></span>
        </button>
      </div>
      <div class="text-danger" *ngIf="regForm.get('password')?.errors?.['weakPassword'] && regForm.get('password')?.touched">
        <small>Password must be at least 8 characters and include uppercase, lowercase, a number and a special character.</small>
      </div>
      <div class="text-success" *ngIf="regForm.get('password')?.valid">
        <small>Strong password</small>
      </div>
    </div>

    <!-- Confirm password -->
    <div class="mb-3">
      <label class="form-label fw-bold">Confirm Password:</label>
      <div class="input-group">
        <input
          [type]="showConfirmPass ? 'text' : 'password'"
          class="form-control"
          formControlName="confirmPass">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="showConfirmPass = !showConfirmPass"
          [attr.aria-label]="showConfirmPass ? 'Hide password' : 'Show password'">
          <span *ngIf="!showConfirmPass"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/></svg></span>
          <span *ngIf="showConfirmPass"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/><path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/></svg></span>
        </button>
      </div>
      <!-- Mismatch error from regForm (cross-field) -->
      <div class="text-danger" *ngIf="regForm.errors?.['mismatch'] && regForm.get('confirmPass')?.touched">
        <small>Confirmation password does not match.</small>
      </div>
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="submit" class="btn btn-primary px-4" [disabled]="regForm.invalid">
        Register
      </button>
      <button type="button" class="btn btn-secondary px-3" (click)="setDefaultValues()">
        Default values
      </button>
    </div>

  </form>
</div>
